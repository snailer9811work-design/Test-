<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Task Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <header class="app__header">
        <h1 class="app__title">Tasks</h1>
        <p class="app__subtitle">A tiny full-stack demo running in your Cloud Agent environment.</p>
      </header>

      <form id="task-form" class="composer" autocomplete="off">
        <input
          id="task-input"
          class="composer__input"
          type="text"
          name="title"
          placeholder="What needs doing?"
          aria-label="Task title"
          maxlength="200"
          required
        />
        <button class="composer__button" type="submit">Add</button>
      </form>

      <section class="stats" id="stats" aria-live="polite"></section>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>

      <p id="empty-state" class="empty-state" hidden>No tasks yet — add your first one above.</p>
    </main>

    <script src="./app.js" type="module"></script>
  </body>
</html>
